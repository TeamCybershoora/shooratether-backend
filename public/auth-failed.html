<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHOORA TETHER - Authentication Notice</title>
  <style>
    :root {
      --bg: #090D16;
      --card-bg: rgba(18, 24, 38, 0.85);
      --border: rgba(255, 255, 255, 0.1);
      --text: #F8FAFC;
      --text-muted: #94A3B8;
      --accent-rose: #EF4444;
      --accent-cyan: #00E5FF;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background-image: radial-gradient(circle at 50% 20%, rgba(239, 68, 68, 0.1) 0%, transparent 60%);
    }
    .card {
      max-width: 480px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 20px;
      padding: 36px 32px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(239, 68, 68, 0.15);
      backdrop-filter: blur(12px);
    }
    .icon-box {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      border-radius: 16px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-rose);
    }
    h1 {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 10px;
    }
    p {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .error-box {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 12px;
      font-family: monospace;
      font-size: 11.5px;
      color: #FCA5A5;
      word-break: break-all;
      margin-bottom: 24px;
      text-align: left;
    }
    .btn-group {
      display: flex;
      gap: 12px;
      justify-content: center;
    }
    .btn {
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #00E5FF;
      color: #000;
    }
    .btn-primary:hover {
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-box">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
    </div>
    <h1>Authentication Notice</h1>
    <p>We encountered an issue while finalizing your login session.</p>

    <div class="error-box" id="errorMsg">Authentication incomplete.</div>

    <div class="btn-group">
      <a href="/api/auth/google" class="btn btn-primary" id="retryBtn">Retry Sign In</a>
      <a href="shooratether://auth/cancel" class="btn btn-secondary">Open App</a>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const err = params.get('error') || 'Unknown error occurred.';
    document.getElementById('errorMsg').textContent = err;
  </script>
</body>
</html>
